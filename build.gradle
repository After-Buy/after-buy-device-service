plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.After_Buy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 시스템 헬스 체크 및 모니터링 (Docker 컨테이너 생존 및 상태 체크용)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 데이터베이스 ORM 및 기기/폴더 엔티티 관리 (device_db 연동)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 클라이언트가 보낸 기기 등록 DTO 파라미터 유효성 검사 (@Valid 등 적용)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 기기 및 영수증 REST API 엔드포인트 구축을 위한 필수 웹 프레임워크
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 외부 API(네이버 쇼핑 등) 및 타 마이크로서비스 비동기 호출 클라이언트 (WebClient)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// API 명세서 포맷 자동 생성 및 Swagger UI 제공
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	
	// AWS 연동 라이브러리 버전 통합 관리 (BOM) - AWS 접속 정보 미비로 인한 에러 방지를 위해 임시 주석 처리
	// implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1')
	// 기기 이미지 및 영수증 클라우드 업로드 전용 (S3)
	// implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
	// Textract 비동기 OCR 처리 원격 함수 호출 전용 (Lambda)
	// implementation 'software.amazon.awssdk:lambda'

	// 앱에서 넘어온 JWT 토큰 페이로드 자체 해석 및 위조 검증용 (JJWT)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// 기기 및 서류 엔티티용 Lombok (Getter, Setter, Builder 패턴 등 코드 다이어트 도구)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// AWS RDS MySQL 연결용 공식 JDBC Database 드라이버
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 스프링 기본 통합 테스트 모듈 세트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// WebFlux(WebClient) 외부 API 호출 연관 비동기 통신 로직 테스트용
	testImplementation 'io.projectreactor:reactor-test'
	// JUnit5(Jupiter) 플랫폼 테스트 구동 엔진
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
