# Prod 환경 전용 설정
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false


springdoc:
  swagger-ui:
    path: /api/devices/swagger-ui.html
  api-docs:
    path: /api/devices/v3/api-docs

logging:
  level:
    root: WARN
    com.After_Buy: INFO
