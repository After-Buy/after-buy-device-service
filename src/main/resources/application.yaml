server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: DeviceService

  # env 파일 내의 환경변수를 불러오는 설정 (확장자가 없으므로 properties 형식으로 강제 파싱)
  config:
    import: optional:file:.env[.properties]

  # 데이터베이스(MySQL) 연결 설정 (device_db)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA(Hibernate) 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # AWS 연동 설정 (Spring Cloud AWS)
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_S3_BUCKET}

# 내부 서비스 통신용 시크릿 키 (MSA 내부 API 접근 보안)
internal:
  secret-key: ${INTERNAL_SECRET_KEY}

# JWT 설정 (Auth Service와 동일한 비밀키 공유 — 토큰 검증 전용)
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

# 네이버 쇼핑 외부 API 연동 정보 (.env 매핑)
naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}

# Google Cloud Vertex AI Gemini 연동 설정 (.env 매핑)
vertex:
  api-key: ${VERTEX_API_KEY}

# AWS Lambda OCR 연동 설정 (.env 매핑)
aws:
  lambda:
    function-url: ${AWS_LAMBDA_FUNCTION_URL}
